<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0f16"><link rel="manifest" href="/manifest.webmanifest"><title>TIMBLOGPLAY AI</title><style>
:root{--bg:#080b10;--panel:#10151d;--panel2:#151c26;--line:#273140;--text:#f4f7fb;--muted:#8c98aa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Arial,sans-serif;height:100dvh}.app{height:100%;display:flex}.side{width:285px;background:var(--panel);border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px}.brand{font-weight:900;font-size:18px;padding:8px}.brand span{font-size:11px;background:#20283a;border-radius:8px;padding:3px 6px;color:#aebcff}.btn,.tool,.send{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:11px;padding:10px;cursor:pointer}.tools{display:flex;flex-wrap:wrap;gap:6px}.tool{font-size:12px}.section{border-top:1px solid var(--line);padding-top:10px}.side h4{margin:4px 0;color:var(--muted);font-size:12px}.list{overflow:auto;max-height:30vh}.item{padding:8px;border-radius:8px;color:#c9d0dd;cursor:pointer;font-size:13px}.item:hover{background:#1a202b}.main{min-width:0;flex:1;display:flex;flex-direction:column}.top{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:800}.status{font-size:11px;color:var(--muted)}.menu{display:none}.chat{flex:1;overflow:auto;padding:26px}.wrap{max-width:920px;margin:auto}.welcome{text-align:center;padding-top:17vh}.welcome h1{font-size:38px;margin:0 0 10px}.sub{color:var(--muted)}.msg{display:flex;gap:12px;margin-bottom:24px}.avatar{width:34px;height:34px;min-width:34px;border-radius:10px;background:#1c2431;display:grid;place-items:center}.body{white-space:pre-wrap;line-height:1.65;max-width:820px;overflow-wrap:anywhere}.user .body{background:#161c26;border:1px solid var(--line);padding:11px 14px;border-radius:15px}.meta{color:#68748a;font-size:11px;margin-top:5px}.composer{border-top:1px solid var(--line);padding:10px}.box{max-width:920px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:7px;display:flex;align-items:flex-end}.box textarea{flex:1;min-height:44px;max-height:180px;background:transparent;color:white;border:0;outline:0;resize:none;padding:10px;font:inherit}.send{width:48px;height:44px}.filebar{max-width:920px;margin:0 auto 7px;display:flex;gap:7px;overflow:auto}.chip{background:#171d28;border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:11px;white-space:nowrap}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.modal.open{display:flex}.card{width:min(700px,100%);max-height:90dvh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.card h2{margin-top:0}.input{width:100%;background:#0b0e14;color:white;border:1px solid var(--line);border-radius:9px;padding:10px;margin:7px 0}.row{display:flex;gap:8px;margin:10px 0}.row>*{flex:1}.drop{border:1px dashed #3b4556;padding:20px;text-align:center;border-radius:12px;color:var(--muted);margin:10px 0}@media(max-width:760px){.side{position:fixed;z-index:4;inset:0 auto 0 0;width:min(310px,88vw);transform:translateX(-105%);transition:.2s}.side.open{transform:translateX(0)}.menu{display:block}.chat{padding:15px}.top{padding:0 12px}.welcome{padding-top:14vh}.welcome h1{font-size:29px}.composer{padding-bottom:max(8px,env(safe-area-inset-bottom))}}
</style></head><body><div class="app"><aside id="side" class="side"><div class="brand">⚡ TIMBLOGPLAY AI <span>5.0</span></div><button class="btn" onclick="newChat();closeSide()">＋ Новый чат</button><div class="tools"><button class="tool" onclick="quick('Найди актуальную информацию в интернете о ');closeSide()">🌐 Поиск</button><button class="tool" onclick="quick('Помоги с Minecraft: ');closeSide()">⛏️ Minecraft</button><button class="tool" onclick="quick('Запомни: ');closeSide()">🧠 Память</button><button class="tool" onclick="openFiles();closeSide()">📁 Файлы</button><button class="tool" onclick="openImage();closeSide()">🖼️ Фото</button><button class="tool" onclick="openProjects();closeSide()">🗂️ Проекты</button><button class="tool" onclick="openSettings();closeSide()">⚙️ Настройки</button></div><div class="section"><h4>ЧАТЫ</h4><div id="chats" class="list"></div></div><div class="section"><h4>ФАЙЛЫ</h4><div id="files" class="list"></div></div><div style="margin-top:auto;color:var(--muted);font-size:11px">Память: <b id="memCount">…</b></div></aside><main class="main"><div class="top"><button class="btn menu" onclick="toggleSide()">☰</button><span>TIMBLOGPLAY AI</span><span id="status" class="status">проверка…</span></div><div id="chat" class="chat"><div id="wrap" class="wrap"><div class="welcome"><h1>Чем займёмся?</h1><div class="sub">Агент • память • веб • файлы • изображения • Minecraft</div></div></div></div><div class="composer"><div id="filebar" class="filebar"></div><div class="box"><textarea id="input" rows="1" placeholder="Напиши сообщение…"></textarea><button class="send" onclick="send()">➤</button></div></div></main></div><div id="modal" class="modal"><div class="card" id="card"></div></div><script>
let ms=[],chatId=null,projectId=null;const $=id=>document.getElementById(id),input=$('input'),wrap=$('wrap'),chat=$('chat');const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toggleSide(){$('side').classList.toggle('open')}function closeSide(){$('side').classList.remove('open')}function clearWelcome(){wrap.querySelector('.welcome')?.remove()}function add(role,text,meta=''){clearWelcome();const e=document.createElement('div');e.className='msg '+role;e.innerHTML=`<div class="avatar">${role==='user'?'👤':'⚡'}</div><div><div class="body"></div><div class="meta"></div></div>`;e.querySelector('.body').textContent=text;e.querySelector('.meta').textContent=meta;wrap.append(e);chat.scrollTop=chat.scrollHeight;return e.querySelector('.body')}
function newChat(){ms=[];chatId=null;wrap.innerHTML='<div class="welcome"><h1>Чем займёмся?</h1><div class="sub">Агент • память • веб • файлы • изображения • Minecraft</div></div>';input.focus()}function quick(x){input.value=x;input.focus()}function closeModal(){$('modal').classList.remove('open')}
async function health(){try{const r=await fetch('/api/health',{headers:auth()});const d=await r.json();$('status').textContent=(d.provider||'model')+' • '+d.model;$('memCount').textContent=d.memory}catch{$('status').textContent='сервер недоступен'}}
function auth(){const p=localStorage.getItem('tbp_password');return p?{'x-app-password':p}:{}}
async function login(){if(localStorage.getItem('tbp_password'))return true;const p=prompt('Пароль приложения:');if(p===null)return false;const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});if(!r.ok){alert('Неверный пароль');return false}localStorage.setItem('tbp_password',p);return true}
async function api(url,opt={}){opt.headers={...(opt.headers||{}),...auth()};let r=await fetch(url,opt);if(r.status===401&&await login()){opt.headers={...(opt.headers||{}),...auth()};r=await fetch(url,opt)}return r}
async function openProjects(){const r=await api('/api/projects');const d=await r.json();$('card').innerHTML=`<h2>🗂️ Проекты</h2><p style="color:var(--muted)">Разделяй чаты по задачам.</p><div class="row"><input id="pn" class="input" placeholder="Название проекта"><button class="btn" onclick="createProject()">＋ Создать</button></div><div>${d.map(x=>`<div class="item" style="border:1px solid var(--line);margin:6px 0" onclick="selectProject('${x.id}')">🗂️ ${esc(x.name)}<br><small>${esc(x.description||'')}</small></div>`).join('')||'<div class="item">Пока нет проектов</div>'}</div><button class="btn" onclick="closeModal()">Закрыть</button>`;$('modal').classList.add('open')}
async function createProject(){const n=$('pn').value.trim();if(!n)return;await api('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})});openProjects()}
function selectProject(id){projectId=id;newChat();closeModal()}
async function loadChats(){const r=await api('/api/chats');if(!r.ok)return;const d=await r.json();$('chats').innerHTML=d.map(x=>`<div class="item" onclick="loadChat('${x.id}');closeSide()">${esc(x.title)}</div>`).join('')||'<div class="item">Нет чатов</div>'}
async function loadChat(id){const r=await api('/api/chats/'+id);if(!r.ok)return;const d=await r.json();chatId=id;ms=d.messages.map(x=>({role:x.role,content:x.content}));wrap.innerHTML='';for(const m of ms)add(m.role,m.content)}
async function send(){const t=input.value.trim();if(!t)return;input.value='';ms.push({role:'user',content:t});add('user',t);const b=add('assistant','Думаю…');try{const r=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t,messages:ms.slice(0,-1),chatId,projectId})});const d=await r.json();if(!r.ok)throw Error(d.error||'Ошибка');chatId=d.chatId;b.textContent=d.reply;b.parentElement.querySelector('.meta').textContent=d.tools?.length?'Инструменты: '+d.tools.join(', '):'';ms.push({role:'assistant',content:d.reply});loadChats();health()}catch(e){b.textContent='Ошибка: '+e.message;ms.pop()}}
input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
function openFiles(){$('card').innerHTML='<h2>📁 Файлы</h2><div class="drop">TXT, MD, JSON, CSV, PDF, DOCX и код.<br><input id="up" type="file" multiple></div><div id="flist">Загрузка…</div><button class="btn" onclick="closeModal()">Закрыть</button>';$('modal').classList.add('open');loadFiles(true)}
async function loadFiles(inModal=false){const r=await api('/api/files');if(!r.ok)return;const d=await r.json();$('files').innerHTML=d.map(x=>`<div class="item">📄 ${esc(x.name)}</div>`).join('')||'<div class="item">Нет файлов</div>';if(inModal){$('flist').innerHTML=d.map(x=>`<div class="item">${esc(x.name)} <button class="btn" onclick="delFile('${x.id}')">Удалить</button></div>`).join('')||'Нет файлов';$('up').onchange=uploadFiles}}
async function uploadFiles(){const fd=new FormData();for(const f of $('up').files)fd.append('files',f);const r=await api('/api/files',{method:'POST',body:fd});const d=await r.json();if(!r.ok)alert(d.error);loadFiles(true)}async function delFile(id){await api('/api/files/'+id,{method:'DELETE'});loadFiles(true)}
function openImage(){$('card').innerHTML='<h2>🖼️ Анализ изображения</h2><input id="img" type="file" accept="image/*"><textarea id="ip" class="input" rows="3" placeholder="Что проанализировать?"></textarea><div class="row"><button class="btn" onclick="analyzeImage()">Анализировать</button><button class="btn" onclick="closeModal()">Закрыть</button></div><pre id="ir" style="white-space:pre-wrap"></pre>';$('modal').classList.add('open')}
async function analyzeImage(){const f=$('img').files[0];if(!f)return alert('Выбери изображение');const fd=new FormData();fd.append('image',f);fd.append('prompt',$('ip').value||'Подробно проанализируй изображение.');$('ir').textContent='Анализирую…';const r=await api('/api/analyze-image',{method:'POST',body:fd});const d=await r.json();$('ir').textContent=r.ok?d.reply:'Ошибка: '+d.error}
async function openSettings(){const r=await api('/api/settings');const d=await r.json();$('card').innerHTML=`<h2>⚙️ Настройки</h2><p>Провайдер: <b>${esc(d.provider)}</b><br>Модель: <b>${esc(d.model)}</b><br>Ключ: <b>${d.hasModelKey?'настроен':'не настроен'}</b><br>RCON: <b>${d.hasRcon?'подключён':'не подключён'}</b><br>Защита: <b>${d.protected?'включена':'выключена'}</b></p><p style="color:var(--muted)">Теперь агент сам выбирает инструменты и может выполнить несколько шагов подряд.</p><div class="row"><button class="btn" onclick="clearMemory()">Очистить память</button><button class="btn" onclick="localStorage.removeItem('tbp_password');closeModal()">Сбросить пароль</button></div><button class="btn" onclick="closeModal()">Закрыть</button>`;$('modal').classList.add('open')}
async function clearMemory(){if(confirm('Удалить всю память?')){await api('/api/memory',{method:'DELETE'});health();closeModal()}}$('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
loadChats();loadFiles();health();setInterval(health,30000);
</script></body></html>
